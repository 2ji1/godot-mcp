# Add this once to the global Codex config (~/.codex/config.toml).
# GODOT_EXECUTABLE is optional when godot is already on PATH.
[mcp_servers.godot]
command = "node"
args = ["C:\\path\\to\\godot-mcp\\mcp-server\\dist\\index.js"]
env = { GODOT_EXECUTABLE = "C:\\path\\to\\Godot.exe" }
startup_timeout_sec = 10
tool_timeout_sec = 60
